<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign up | Southeast University</title><link rel="stylesheet" href="assets/style.css"><script src="assets/script.js" defer></script></head><body class="auth-body"><header class="auth-header"><a class="brand" href="index.html"><span class="brand-mark">SU</span><span>Southeast University<small>Education Today, Leadership Tomorrow</small></span></a><a class="text-link" href="index.html">← Back to home</a></header><main class="auth-main"><form class="auth-card" id="signup-form"><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Create your account.</h1><p class="auth-subtitle">Sign up to get started.</p><label for="signup-name">Full name</label><input id="signup-name" required autocomplete="name" placeholder="Your full name"><label for="signup-email">Email address</label><input id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="signup-password">Create password</label><input id="signup-password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><label for="signup-confirm">Confirm password</label><input id="signup-confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter your password"><button class="button button-wide" type="submit">Create account →</button><p class="form-message" aria-live="polite"></p><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p><p class="demo-warning">Demo only: signup uses browser storage, not a secure server. Do not use a real or reused password.</p></form></main></body></html>
